name: 멤버 정보 추가
description: 내 페이지에 아직 없는 정보를 새로 넣고 싶을 때 사용합니다.
title: "[Member] Add info: "
labels: ["member-profile"]
body:
  - type: markdown
    attributes:
      value: |
        홈페이지에 **아직 없는** 정보를 추가해 주세요.
        비워 둔 칸은 반영하지 않습니다. Publications는 `_papers`에서 자동으로 붙으니 여기에 적지 마세요.
        사진은 이 이슈 하단에 파일로 첨부해 주세요.

  - type: input
    id: name
    attributes:
      label: 이름 (English)
      placeholder: Soyeon Baek
    validations:
      required: true

  - type: input
    id: name_kor
    attributes:
      label: 이름 (한글)
      placeholder: 백소연
    validations:
      required: true

  - type: input
    id: member_url
    attributes:
      label: 멤버 페이지 주소
      description: 예) https://cnu-ants.github.io/members/soyeonb
      placeholder: https://cnu-ants.github.io/members/

  - type: checkboxes
    id: add_fields
    attributes:
      label: 추가할 항목
      description: 이번에 넣고 싶은 항목만 고르세요.
      options:
        - label: GitHub
        - label: LinkedIn
        - label: 관심 분야 (Research interests)
        - label: 짧은 소개
        - label: 학력 (Education)
        - label: 경력 / 인턴
        - label: 수상 (Honors)
        - label: 개인 홈페이지
        - label: Google Scholar
        - label: 프로필 사진

  - type: input
    id: github
    attributes:
      label: GitHub
      placeholder: https://github.com/username

  - type: input
    id: linkedin
    attributes:
      label: LinkedIn
      placeholder: https://www.linkedin.com/in/username

  - type: input
    id: homepage
    attributes:
      label: 개인 홈페이지
      placeholder: https://

  - type: input
    id: scholar
    attributes:
      label: Google Scholar
      placeholder: https://scholar.google.com/citations?user=

  - type: textarea
    id: interests
    attributes:
      label: 관심 분야
      description: 쉼표로 구분해 주세요.
      placeholder: static analysis, Android, binary analysis

  - type: textarea
    id: introduction
    attributes:
      label: 짧은 소개
      description: 한국어나 영어 모두 가능합니다. 2~5문장 정도면 충분합니다.
      placeholder: I am an M.S. student in the ANTS lab...

  - type: textarea
    id: edu
    attributes:
      label: 학력
      description: 최근 순서로, 한 줄에 하나씩. `학교, 학위/전공, 기간, (선택) 지도교수`
      placeholder: |
        Chungnam National University, M.S. Department of Computer Science and Engineering, 03.2024 - present, Advisor: Sungho Lee
        Chungnam National University, B.S. Department of Computer Science and Engineering, 03.2020 - 02.2024

  - type: textarea
    id: exps
    attributes:
      label: 경력 / 인턴
      description: 최근 순서로, 한 줄에 하나씩. `기관, 역할, 기간`
      placeholder: |
        NAVER, Software Engineering Intern, 07.2024 - 08.2024

  - type: textarea
    id: awards
    attributes:
      label: 수상
      description: 최근 순서로, 한 줄에 하나씩. `주최, 상 이름, 연도`
      placeholder: |
        한국정보과학회(KSC), 우수발표논문상, 2024

  - type: textarea
    id: notes
    attributes:
      label: 관리자에게 남길 말
      placeholder: 사진 파일은 이 이슈에 첨부했습니다.
