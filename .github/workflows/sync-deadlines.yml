name: Sync conferences and journals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-conference-deadlines
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync deadlines from CCF Deadlines
        run: python scripts/sync_deadlines.py

      - name: Sync journals from OpenAlex (weekly)
        env:
          OPENALEX_MAILTO: ants.cnu@gmail.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python scripts/sync_journals.py
          else
            echo "Skipping journal sync (runs Mondays 06:00 UTC, or on workflow_dispatch)"
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/conferences.yml _data/journals.yml
          if git diff --staged --quiet; then
            echo "No conference or journal changes"
          else
            git commit -m "Sync conference and journal data"
            git push
          fi

      - name: Sync Google Calendar
        env:
          GOOGLE_CALENDAR_ID: ants.cnu@gmail.com
          GOOGLE_CALENDAR_PURGE_ID: 04e8b4748a864cc0420d48d1c278162e6860e05e3d08fac783d0b7470b4b8093@group.calendar.google.com
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CALENDAR_CREDENTIALS" ]; then
            echo "::warning::GOOGLE_CALENDAR_CREDENTIALS secret is not set. Share the ANTS Conference calendar (ants.cnu@gmail.com) with a service account and add the JSON key to that secret."
            exit 0
          fi
          python scripts/sync_calendar.py
