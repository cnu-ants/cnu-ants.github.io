name: Apply member profile issue

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: member-profile-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >
      github.event.issue.user.type == 'User' &&
      (
        (github.event.action == 'opened' &&
          contains(join(github.event.issue.labels.*.name, ','), 'member-profile')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'member-profile')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write issue payload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/issue.json`, JSON.stringify({
              number: context.issue.number,
              title: context.payload.issue.title,
              body: context.payload.issue.body,
              user: context.payload.issue.user.login,
            }));

      - name: Apply member issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MEMBER_APPLY_COMMENT: ${{ runner.temp }}/member-apply-comment.md
        run: python scripts/apply_member_issue.py --issue-json "$RUNNER_TEMP/issue.json"

      - name: Check for member file changes
        id: diff
        run: |
          if git diff --quiet -- _members; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.diff.outputs.changed == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Build site
        id: build
        if: steps.diff.outputs.changed == 'true'
        run: bundle exec jekyll build

      - name: Comment if the site build failed
        if: failure() && steps.build.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Jekyll 빌드가 실패해서 사이트에는 반영하지 않았습니다. 소개/학력의 YAML이 깨졌거나 사이트 빌드를 막은 값이 있습니다."

      - name: Commit and push if the member file changed
        id: push
        if: success() && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _members/*.md
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No member file changes"
            exit 0
          fi
          git commit -m "Apply member profile from #${{ github.event.issue.number }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Push failed after retries"
          exit 1

      - name: Comment and close after a successful push
        if: success() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/member-apply-comment.md"
          gh issue close "${{ github.event.issue.number }}" --reason completed
