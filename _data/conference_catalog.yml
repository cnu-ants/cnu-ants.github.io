# Lab-owned metadata. Deadlines are filled in by scripts/sync_deadlines.py.
# Inclusion: 소분야가 SE / PL / Sec 이면서 아래 셋을 모두 만족하는 학회만 싣는다.
#   1. 한국정보과학회 2024 우수학술대회 목록에 최우수 또는 우수로 등재
#      (대응표: gist https://gist.github.com/Pusnow/6eb933355b5cb8d31ef1abcb3c3e1206)
#   2. BK21 플러스 CS 우수국제학술대회 목록(2018)에 인정 IF 등재
#   3. CCF Deadlines(allconf.yml)에 등록되어 마감을 동기화할 수 있음
# 따라서 kiise 와 bk21_if 는 모든 항목에 값이 있다. 둘 중 하나라도 비면 목록에서 뺀다.
#
# 제외 사례:
#   - 두 목록 중 한쪽에만 있는 학회: FM, MSR, SANER, VMCAI, ACNS, CHES, CODASPY,
#     EuroS&P, FSE(Fast Software Encryption), PKC, PETS, WiSec, IJCAR, VEE, IFIP SEC, TCC
#   - CCF Deadlines에 없는 학회: FASE, CC, ESOP, TACAS, CSEET, ICLP
#   - 아키텍처 / HPC / 임베디드로 분류되는 학회: PPoPP, PACT, HiPEAC, EMSOFT, CASES, CODES
#   - BK21 목록의 SAC: SIGAPP Applied Computing 으로 CCF Deadlines의 SAC(암호)와 다른 학회
#
# Rank sources:
#   kiise   — 한국정보과학회 2024 우수학술대회 (최우수 / 우수)
#   bk21_if — BK21 플러스 CS 우수국제학술대회 IF (2018), 1~4
#   core    — CCF Deadlines YAML의 CORE 값 (동기화 시 채워짐)
#
# ccfddl_title: CCF Deadlines의 title이 약자와 다를 때만 지정
# ccfddl_sub: allconf.yml에 동명 학회가 있을 때만 지정 (예: FSE)

